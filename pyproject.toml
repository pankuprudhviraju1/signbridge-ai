[project]
name = "signbridge-ai"
version = "2.0.0"
description = "Real-time custom sign-language object detection with TensorFlow"
requires-python = ">=3.10,<3.13"
dependencies = ["opencv-python>=4.9,<5", "numpy>=1.26,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
training = ["tensorflow>=2.15,<2.19", "object-detection @ git+https://github.com/tensorflow/models.git@master#subdirectory=research"]
dev = ["pytest>=8,<9"]

[project.scripts]
signbridge-collect = "signbridge.collection.capture_images:main"
signbridge-detect = "signbridge.inference.webcam:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
